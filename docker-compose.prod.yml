services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_HOST: ${CADDY_HOST}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    image: ${ECR_IMAGE}
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+asyncpg://yata:${POSTGRES_PASSWORD}@db:5432/yata"
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: "production"
      # Explicit opt-in for the real Bedrock LLM client (yata-0018): without
      # it the app serves the local fake, even with AWS credentials present.
      # The container's task/instance role supplies the credentials.
      YATA_LLM: "bedrock"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  db:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: yata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: yata
    ports:
      # Loopback only (R35): reachable from the box itself and from an
      # IAM-authenticated SSM tunnel, never from the internet. The security
      # group is untouched and 5432 stays closed.
      - "127.0.0.1:5432:5432"
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yata -d yata"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
